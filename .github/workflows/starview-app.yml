# Builds the StarView tablet app (app/app) and StarLock, the phone app (app/starlock), and signs both with the StarView key
# (repo secret STARVIEW_KEYSTORE_B64: base64 of keystore/starview.jks). When an app's versionName is new, it publishes a
# release: StarView "v<versionName>" with StarView-<versionName>.apk (StarView's Settings > Tablet > About > Check for
# updates installs it), StarLock "starlock-v<versionName>" with StarLock-<versionName>.apk.
# A push that keeps the same versionName only builds (the APKs are kept as run artifacts for 30 days).
name: StarView app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/starview-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starview-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            app
            .github

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEY: ${{ secrets.STARVIEW_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then
            # no key yet: still build (with a throwaway key) to check the source, but release nothing
            echo "::warning::No STARVIEW_KEYSTORE_B64 secret: building with a throwaway key, no release"
            keytool -genkeypair -keystore "$RUNNER_TEMP/starview.jks" -storepass starview -keypass starview -alias starview \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" >/dev/null
            echo "NO_KEY=1" >> "$GITHUB_ENV"
          else
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/starview.jks"
          fi
          echo "STARVIEW_KEYSTORE=$RUNNER_TEMP/starview.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :starlock:assembleDebug

      - name: Without the key, stop here
        if: env.NO_KEY == '1'
        run: |
          echo "::error::Built fine, but nothing is released until the repository secret STARVIEW_KEYSTORE_B64 is added (Settings > Secrets and variables > Actions)"
          exit 1

      - name: Check the signing key, name the APKs
        id: v
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for m in app:StarView starlock:StarLock; do
            mod=${m%%:*}; app=${m##*:}
            apk=app/$mod/build/outputs/apk/debug/$mod-debug.apk
            "$signer" verify --print-certs "$apk" | tee /dev/stderr \
              | grep -q "SHA-256 digest: 00fecaf167346f9812e0511144e610d3d85f0d2b59096ff60e21b600c754094f" \
              || { echo "::error::$app is not signed with the StarView key: it would not install over the app on the device"; exit 1; }
            name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/$mod/build.gradle.kts)
            code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/$mod/build.gradle.kts)
            cp "$apk" "$app-$name.apk"
            echo "${mod}_name=$name" >> "$GITHUB_OUTPUT"
            echo "${mod}_code=$code" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*.apk"
          retention-days: 30

      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SV_NAME: ${{ steps.v.outputs.app_name }}
          SV_CODE: ${{ steps.v.outputs.app_code }}
          SL_NAME: ${{ steps.v.outputs.starlock_name }}
          SL_CODE: ${{ steps.v.outputs.starlock_code }}
        run: |
          release() {  # tag app name code latest
            if gh release view "$1" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $1 already exists: bump $2's versionName (and versionCode) for a new one."
              return 0
            fi
            printf '%s %s (versionCode %s), built from %s.\n\n%s\n' "$2" "$3" "$4" "${GITHUB_SHA:0:9}" \
              "$(git log -1 --format=%B)" > notes.md
            gh release create "$1" "$2-$3.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$2 $3" --notes-file notes.md --latest="$5"
          }
          # StarView stays the repo's "Latest" release (what the front page shows)
          release "starlock-v$SL_NAME" StarLock "$SL_NAME" "$SL_CODE" false
          release "v$SV_NAME" StarView "$SV_NAME" "$SV_CODE" true
