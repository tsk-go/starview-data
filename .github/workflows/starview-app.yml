# Builds the StarView tablet app from app/ and signs it with the StarView key (repo secret STARVIEW_KEYSTORE_B64:
# base64 of keystore/starview.jks). When versionName in app/app/build.gradle.kts is new, it publishes a release
# "v<versionName>" with StarView-<versionName>.apk - the app's Settings > Tablet > About > Check for updates installs it.
# A push that keeps the same versionName only builds (the APK is kept as a run artifact for 30 days).
name: StarView app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/starview-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starview-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            .github

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEY: ${{ secrets.STARVIEW_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the repository secret STARVIEW_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/starview.jks"
          echo "STARVIEW_KEYSTORE=$RUNNER_TEMP/starview.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Check the signing key
        run: |
          apk=app/app/build/outputs/apk/debug/app-debug.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --print-certs "$apk" | tee /dev/stderr \
            | grep -q "SHA-256 digest: 00fecaf167346f9812e0511144e610d3d85f0d2b59096ff60e21b600c754094f" \
            || { echo "::error::APK is not signed with the StarView key: it would not install over the tablet's app"; exit 1; }

      - name: Version
        id: v
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cp app/app/build/outputs/apk/debug/app-debug.apk "StarView-$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StarView-${{ steps.v.outputs.name }}
          path: StarView-${{ steps.v.outputs.name }}.apk
          retention-days: 30

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          tag="v$NAME"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists: bump versionName (and versionCode) in app/app/build.gradle.kts for a new one."
            exit 0
          fi
          printf 'StarView %s (versionCode %s), built from %s.\n\n%s\n' "$NAME" "$CODE" "${GITHUB_SHA:0:9}" \
            "$(git log -1 --format=%B)" > notes.md
          gh release create "$tag" "StarView-$NAME.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "StarView $NAME" --notes-file notes.md
